[package]
name = "workspace-mgr"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Fixed-policy repository workspace manager for coding agents"
license = "MIT"
repository = "https://github.com/S-kblogN/workspace-mgr"
homepage = "https://github.com/S-kblogN/workspace-mgr"
readme = "README.md"
publish = ["crates-io"]
keywords = ["agents", "storage", "workspace", "automation", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", "scripts/", "tests/e2e/"]

[features]
default = []
# Enables the filesystem-backed storage adapter used only by isolated tests.
# Release archives are built without this feature.
test-storage = []

[[bin]]
name = "workspace-mgr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["clock"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
fs2 = "0.4.3"
md-5 = "0.11.0"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
semver = "1.0.28"
sha2 = "0.11.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = "1.1.4"
walkdir = "2.5.0"
which = "8.0.0"

[dev-dependencies]
assert_cmd = "2.0.17"

[profile.release]
lto = "thin"
strip = true
