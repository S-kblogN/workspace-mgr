[package]
name = "workspace-mgr"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
description = "Policy-driven workspace and Git/DVC transaction manager for coding agents"
license = "MIT"
repository = "https://github.com/S-kblogN/workspace-mgr"
homepage = "https://github.com/S-kblogN/workspace-mgr"
readme = "README.md"
keywords = ["agents", "git", "dvc", "workspace", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/"]

[[bin]]
name = "workspace-mgr"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.42", features = ["clock", "serde"] }
clap = { version = "4.5.48", features = ["derive", "env"] }
fs2 = "0.4.3"
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.10.9"
tempfile = "3.23.0"
thiserror = "2.0.17"
toml = "0.9.7"
walkdir = "2.5.0"
which = "8.0.0"

[dev-dependencies]
assert_cmd = "2.0.17"
predicates = "3.1.3"
pretty_assertions = "1.4.1"

[profile.release]
lto = "thin"
strip = true
