name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and isolated integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Install the local-test DVC runtime
        run: python -m pip install --disable-pip-version-check "dvc==3.67.1"
      - name: Check external commands
        run: |
          git --version
          git lfs version
          dvc version
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast
      - name: Assemble crate package
        run: cargo package --locked
      - name: Package native archive
        run: sh scripts/package-native.sh x86_64-unknown-linux-gnu
      - name: Upload native archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workspace-mgr-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  portability:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install the local-test DVC runtime
        run: python -m pip install --disable-pip-version-check "dvc==3.67.1"
      - name: Check external commands
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          git lfs version
          dvc version
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast
      - name: Package native archive
        run: sh scripts/package-native.sh ${{ matrix.target }}
      - name: Upload native archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workspace-mgr-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
