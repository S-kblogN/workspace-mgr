name: CI

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact Git revision to check
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-rust:
    name: Rust 1.85 compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up minimum supported Rust
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Check production build
        run: cargo check --locked --all-targets --no-default-features

  quality:
    name: Quality and isolated integration tests
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
      - name: Install the local-test DVC runtime
        run: python -m pip install --disable-pip-version-check "dvc==3.67.1"
      - name: Check external commands
        run: |
          git --version
          dvc version
      - name: Check formatting
        run: cargo fmt --check
      - name: Test release state machine
        run: python -m unittest discover -s scripts/tests -p 'test_*.py'
      - name: Audit dependencies and licenses
        uses: EmbarkStudios/cargo-deny-action@v2
      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast
      - name: Test production configuration boundary
        run: cargo test --locked --bin workspace-mgr --no-default-features production_build_rejects_filesystem_storage
      - name: Assemble crate package
        run: cargo package --locked
      - name: Package native archive
        run: sh scripts/package-native.sh x86_64-unknown-linux-gnu
      - name: Exercise native installer
        run: |
          install_root="$(mktemp -d)"
          archive="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          tar -C "${install_root}" -xzf "${archive}"
          package_dir="$(find "${install_root}" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          HOME="${install_root}/home" \
            XDG_DATA_HOME="${install_root}/data" \
            WORKSPACE_MGR_PREFIX="${install_root}/prefix" \
            "${package_dir}/install.sh"
          test -x "${install_root}/prefix/bin/workspace-mgr"
          "${install_root}/prefix/bin/workspace-mgr" --version
      - name: Upload native archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-workspace-mgr-x86_64-unknown-linux-gnu
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  portability:
    name: Test ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install the local-test DVC runtime
        run: python -m pip install --disable-pip-version-check "dvc==3.67.1"
      - name: Check external commands
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
          dvc version
      - name: Test
        run: cargo test --locked --all-features --no-fail-fast
      - name: Package native archive
        run: sh scripts/package-native.sh ${{ matrix.target }}
      - name: Upload native archive
        uses: actions/upload-artifact@v7.0.1
        with:
          name: native-workspace-mgr-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
