name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect declared release
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.state.outputs.name }}
      version: ${{ steps.state.outputs.version }}
      tag: ${{ steps.state.outputs.tag }}
      prerelease: ${{ steps.state.outputs.prerelease }}
      crate_exists: ${{ steps.state.outputs.crate_exists }}
      version_exists: ${{ steps.state.outputs.version_exists }}
      source_sha: ${{ steps.state.outputs.source_sha }}
      tag_exists: ${{ steps.state.outputs.tag_exists }}
      release_exists: ${{ steps.state.outputs.release_exists }}
      release_complete: ${{ steps.state.outputs.release_complete }}
      release_needed: ${{ steps.state.outputs.release_needed }}
    steps:
      - name: Check out main revision
        uses: actions/checkout@v7.0.1
      - name: Require the canonical main branch
        run: |
          test "${GITHUB_REPOSITORY}" = "S-kblogN/workspace-mgr"
          test "${GITHUB_REF}" = "refs/heads/main"
      - name: Inspect Cargo, crates.io, and GitHub state
        id: state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/release_state.py inspect \
            --repository "${GITHUB_REPOSITORY}" \
            --github-sha "${GITHUB_SHA}"

  ci:
    name: CI release gate
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  e2e:
    name: End-to-end release gate
    uses: ./.github/workflows/e2e.yml
    with:
      ref: ${{ github.sha }}

  package:
    name: Native release packages
    needs:
      - inspect
      - ci
      - e2e
    if: needs.inspect.outputs.release_needed == 'true'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.inspect.outputs.source_sha }}
      version: ${{ needs.inspect.outputs.version }}

  no-release:
    name: Version is already released
    needs:
      - inspect
      - ci
      - e2e
    if: needs.inspect.outputs.release_needed == 'false'
    runs-on: ubuntu-24.04
    steps:
      - name: Report converged state
        run: |
          echo "${{ needs.inspect.outputs.name }} ${{ needs.inspect.outputs.version }} is already complete"

  publish:
    name: Publish and finalize release
    needs:
      - inspect
      - ci
      - e2e
      - package
    if: >-
      always() &&
      needs.inspect.result == 'success' &&
      needs.ci.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.package.result == 'success' &&
      needs.inspect.outputs.release_needed == 'true'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out release control plane
        uses: actions/checkout@v7.0.1
        with:
          path: control
      - name: Check out declared release source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.inspect.outputs.source_sha }}
          fetch-depth: 0
          path: source
      - name: Download native packages
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          pattern: release-native-workspace-mgr-*
          merge-multiple: true
      - name: Verify native package checksums
        working-directory: dist
        run: |
          for checksum in *.sha256; do
            shasum -a 256 -c "${checksum}"
          done
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" = 3
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l | tr -d ' ')" = 3
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Recheck release state
        id: current
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          state="$(python scripts/release_state.py inspect \
            --repository "${GITHUB_REPOSITORY}" \
            --github-sha "${GITHUB_SHA}")"
          test "$(printf '%s' "${state}" | jq -r .version)" = "${EXPECTED_VERSION}"
          test "$(printf '%s' "${state}" | jq -r .source_sha)" = "${EXPECTED_SOURCE_SHA}"
      - name: Require first-publish credential
        if: >-
          steps.current.outputs.version_exists == 'false' &&
          steps.current.outputs.crate_exists == 'false'
        env:
          CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: |
          if [ -z "${CRATES_IO_BOOTSTRAP_TOKEN}" ]; then
            echo "CRATES_IO_BOOTSTRAP_TOKEN is required for the first crate version" >&2
            exit 1
          fi
      - name: Authenticate with crates.io trusted publishing
        id: crates-auth
        if: >-
          steps.current.outputs.version_exists == 'false' &&
          steps.current.outputs.crate_exists == 'true'
        uses: rust-lang/crates-io-auth-action@v1.0.5
      - name: Publish first crate version
        if: >-
          steps.current.outputs.version_exists == 'false' &&
          steps.current.outputs.crate_exists == 'false'
        working-directory: source
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
        run: cargo publish --locked
      - name: Publish crate version with OIDC
        if: >-
          steps.current.outputs.version_exists == 'false' &&
          steps.current.outputs.crate_exists == 'true'
        working-directory: source
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: cargo publish --locked
      - name: Wait for crates.io and verify published source
        id: published
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
        run: |
          for attempt in $(seq 1 30); do
            state="$(python scripts/release_state.py inspect \
              --repository "${GITHUB_REPOSITORY}" \
              --github-sha "${GITHUB_SHA}")"
            if [ "$(printf '%s' "${state}" | jq -r .version_exists)" = "true" ]; then
              source_sha="$(printf '%s' "${state}" | jq -r .source_sha)"
              test "${EXPECTED_SOURCE_SHA}" = "${source_sha}"
              python scripts/release_state.py inspect \
                --repository "${GITHUB_REPOSITORY}" \
                --github-sha "${GITHUB_SHA}" >/dev/null
              exit 0
            fi
            echo "Waiting for crates.io index (${attempt}/30)"
            sleep 2
          done
          exit 1
      - name: Create immutable release tag
        if: steps.published.outputs.tag_exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.published.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.published.outputs.tag }}
          RELEASE_VERSION: ${{ steps.published.outputs.version }}
        run: |
          tag_object="$({
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${RELEASE_TAG}" \
              -f message="workspace-mgr ${RELEASE_VERSION}" \
              -f object="${RELEASE_SHA}" \
              -f type=commit
          } | jq -r .sha)"
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${tag_object}"
      - name: Render release notes
        working-directory: control
        run: python scripts/release_state.py notes --output ../release-notes.md
      - name: Create or repair GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_EXISTS: ${{ steps.published.outputs.release_exists }}
          RELEASE_TAG: ${{ steps.published.outputs.tag }}
          RELEASE_VERSION: ${{ steps.published.outputs.version }}
          PRERELEASE: ${{ steps.published.outputs.prerelease }}
        run: |
          if [ "${RELEASE_EXISTS}" = "true" ]; then
            gh release upload "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            prerelease_flag=""
            if [ "${PRERELEASE}" = "true" ]; then
              prerelease_flag="--prerelease"
            fi
            gh release create "${RELEASE_TAG}" dist/* \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "workspace-mgr ${RELEASE_VERSION}" \
              --notes-file release-notes.md \
              ${prerelease_flag}
          fi
      - name: Verify converged release state
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_SOURCE_SHA: ${{ needs.inspect.outputs.source_sha }}
          EXPECTED_VERSION: ${{ needs.inspect.outputs.version }}
        run: |
          for attempt in $(seq 1 15); do
            state="$(python scripts/release_state.py inspect \
              --repository "${GITHUB_REPOSITORY}" \
              --github-sha "${GITHUB_SHA}")"
            test "$(printf '%s' "${state}" | jq -r .version)" = "${EXPECTED_VERSION}"
            test "$(printf '%s' "${state}" | jq -r .source_sha)" = "${EXPECTED_SOURCE_SHA}"
            if [ "$(printf '%s' "${state}" | jq -r .release_needed)" = "false" ]; then
              exit 0
            fi
            echo "Waiting for GitHub Release state (${attempt}/15)"
            sleep 2
          done
          exit 1
