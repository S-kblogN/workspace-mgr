name: End-to-end

on:
  pull_request:
  workflow_call:
    inputs:
      ref:
        description: Exact Git revision to check
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  system:
    name: MinIO S3 and network Git lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_BUCKET: workspace-mgr-e2e
      MINIO_ROOT_USER: workspace-mgr-e2e
      MINIO_ROOT_PASSWORD: workspace-mgr-e2e-secret
      AWS_ACCESS_KEY_ID: workspace-mgr-e2e
      AWS_SECRET_ACCESS_KEY: workspace-mgr-e2e-secret
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
      - name: Set up Rust
        run: |
          rustup show active-toolchain
          rustc --version
          cargo --version
      - name: Install isolated S3 fixture client
        run: python -m pip install --disable-pip-version-check "boto3>=1.40,<2"
      - name: Check external commands
        run: |
          git --version
      - name: Start versioned S3-compatible service
        run: |
          # The official container registry no longer serves this release.
          # Keep the same MinIO version using its checksum-pinned official binary.
          curl --fail --location --retry 3 \
            https://github.com/minio/minio/releases/download/RELEASE.2025-09-07T16-13-09Z/minio.linux-amd64.RELEASE.2025-09-07T16-13-09Z \
            --output "${RUNNER_TEMP}/minio"
          printf '%s  %s\n' \
            7c5bd8512c6e966455b1d198209358b2d191c77a83ab377c4073281065fb855f \
            "${RUNNER_TEMP}/minio" | sha256sum --check
          chmod +x "${RUNNER_TEMP}/minio"
          mkdir -p "${RUNNER_TEMP}/minio-data"
          nohup "${RUNNER_TEMP}/minio" server "${RUNNER_TEMP}/minio-data" \
            --address 127.0.0.1:9000 >"${RUNNER_TEMP}/minio.log" 2>&1 &
          echo "$!" >"${RUNNER_TEMP}/minio.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/ready >/dev/null; then
              exit 0
            fi
            echo "Waiting for MinIO (${attempt}/60)"
            sleep 1
          done
          cat "${RUNNER_TEMP}/minio.log"
          exit 1
      - name: Build workspace-mgr
        run: cargo build --locked --features test-storage
      - name: Run comprehensive system lifecycle
        env:
          WORKSPACE_MGR_BIN: ${{ github.workspace }}/target/debug/workspace-mgr
          WORKSPACE_MGR_E2E_ROOT: ${{ runner.temp }}/workspace-mgr-e2e
        run: python tests/e2e/run.py
      - name: Build archive test host adapter
        run: cargo build --locked --features test-storage
      - name: Verify complete archive migration and historical hydration
        env:
          WORKSPACE_MGR_BIN: ${{ github.workspace }}/target/debug/workspace-mgr
          WORKSPACE_MGR_E2E_ROOT: ${{ runner.temp }}/workspace-mgr-archive-e2e
        run: python scripts/test_archive_s3.py
      - name: Capture MinIO log
        if: always()
        run: |
          evidence_root="${RUNNER_TEMP}/workspace-mgr-e2e"
          mkdir -p "${evidence_root}"
          cp "${RUNNER_TEMP}/minio.log" "${evidence_root}/minio.log" || true
      - name: Upload E2E evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workspace-mgr-e2e-evidence
          path: |
            ${{ runner.temp }}/workspace-mgr-e2e/
            ${{ runner.temp }}/workspace-mgr-archive-e2e/
          if-no-files-found: warn
          retention-days: 14
      - name: Stop virtual S3 service
        if: always()
        run: |
          if test -f "${RUNNER_TEMP}/minio.pid"; then
            kill "$(cat "${RUNNER_TEMP}/minio.pid")" || true
          fi
