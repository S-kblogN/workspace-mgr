name: Package native binaries

on:
  workflow_call:
    inputs:
      ref:
        description: Exact Git revision to package
        required: true
        type: string
      version:
        description: Expected Cargo package version
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: Git revision to package
        required: false
        default: main
        type: string
      version:
        description: Expected Cargo package version; empty accepts the checked-out version
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Build and assemble native archive
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          actual_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [ -n "${EXPECTED_VERSION}" ] && [ "${actual_version}" != "${EXPECTED_VERSION}" ]; then
            echo "checked-out package version ${actual_version} does not match ${EXPECTED_VERSION}" >&2
            exit 1
          fi
          sh scripts/package-native.sh ${{ matrix.target }}
      - name: Upload immutable workflow artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-native-workspace-mgr-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14
